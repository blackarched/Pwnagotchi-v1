version: '3.8'
services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["3000:3000"]
    healthcheck: …
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    env_file: .env
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
networks:
  default: {}