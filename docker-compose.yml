version: '3.8'

networks:
  pwnagotchi_net:
    driver: bridge

volumes:
  redis-data:
    driver: local

services:
  redis:
    image: redis:7-alpine
    container_name: pwnagotchi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - pwnagotchi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend # Ensure context is specified if Dockerfile is not in root of context
      dockerfile: Dockerfile # Explicitly state Dockerfile name
    container_name: pwnagotchi-backend
    env_file: .env # Loads variables from .env file first
    environment: # These can override or add to what's in .env for this service
      # For testing, point to the mock Pwnagotchi service
      # These will be used by pwnagotchiService.js if NODE_ENV=test or if they are present
      MOCK_PWNAGOTCHI_API_URL: http://mock-pwnagotchi:8666/api/v1
      MOCK_PWNAGOTCHI_CLI_URL: http://mock-pwnagotchi:8666/api/v1/cli-command
      # Ensure NODE_ENV can be set to 'test' when running integration tests,
      # or rely on the presence of MOCK_* URLs in pwnagotchiService.js
      # NODE_ENV: ${NODE_ENV:-development} # Can be overridden by test runner environment
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
      mock-pwnagotchi: # Backend depends on mock for testing
        condition: service_started # Or service_healthy if mock implements a healthcheck
    networks:
      - pwnagotchi_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/healthz || exit 1"] # Updated healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args: # Add build arguments for Vite
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
        VITE_WEBSOCKET_PATH: ${VITE_WEBSOCKET_PATH:-/socket.io}
    container_name: pwnagotchi-frontend # Added container_name
    env_file: .env # For build args from .env
    ports:
      - "${FRONTEND_PORT:-8080}:80" # Use variable from .env, default to 8080
    depends_on:
      backend:
        condition: service_healthy
    networks: # Assign to custom network
      - pwnagotchi_net
    healthcheck: # Added healthcheck for frontend
      test: ["CMD-SHELL", "wget --spider -q http://localhost/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mock-pwnagotchi:
    build:
      context: ./test/mock-pwnagotchi
      dockerfile: Dockerfile
    container_name: mock-pwnagotchi-server
    networks:
      - pwnagotchi_net
    ports:
      - "8666:8666" # Expose mock server port for direct inspection if needed
    # No restart policy, typically only run during tests

  prometheus:
    image: prom/prometheus:v2.47.0 # Use a specific version
    container_name: pwnagotchi-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Optional: Persist Prometheus data
      # - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - pwnagotchi_net
    depends_on:
      - backend

# Optional: Define prometheus-data volume if you want to persist its data
# volumes:
#   redis-data:
#     driver: local
#   prometheus-data:
#     driver: local
# Removed default network, using pwnagotchi_net instead.
# Ensure prometheus-data is added to volumes list if uncommented above.