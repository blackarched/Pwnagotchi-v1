# This Kubernetes manifest deploys the Pwnagotchi Dashboard application (backend, frontend, redis).

# --- ConfigMap ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pwnagotchi-dashboard-config
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
data:
  # Helm chart: data: {{ toYaml .Values.config | nindent 2 }}
  NODE_ENV: "production"
  LOG_LEVEL: "info" # e.g., {{ .Values.config.logLevel | default "info" }}
  BACKEND_PORT: "3001"
  REDIS_URL: "redis://pwnagotchi-redis-service:6379" # Assumes Redis service name
  WEBSOCKET_PATH: "/socket.io"
  ENABLE_PWNAGOTCHI_POLLING: "true"
  PWNAGOTCHI_POLL_INTERVAL_MS: "5000"
  ENABLE_METRICS: "true"

  # Pwnagotchi Connection (replace with actual values or use Secrets for sensitive parts)
  PWNAGOTCHI_HOST: "your-pwnagotchi-ip-or-hostname" # {{ .Values.pwnagotchi.host }}
  PWNAGOTCHI_PORT: "22" # {{ .Values.pwnagotchi.port | default "22" }}
  PWNAGOTCHI_USER: "pi" # {{ .Values.pwnagotchi.user | default "pi" }}
  # PWNAGOTCHI_SSH_KEY_PATH is the path *inside the container* where the key from the secret will be mounted.
  PWNAGOTCHI_SSH_KEY_PATH: "/etc/ssh-keys/pwnagotchi_rsa" # Standardized path
  PWNAGOTCHI_API_BASE_URL: "http://your-pwnagotchi-ip-or-hostname:8666/api/v1" # {{ .Values.pwnagotchi.apiBaseUrl }} (if used)

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000" # 15 minutes
  RATE_LIMIT_MAX_REQUESTS: "100"

  # CORS Origin
  CORS_ORIGIN: "http://your-frontend-service-or-ingress-url" # {{ .Values.corsOrigin }}

  # Frontend build-time args (documented here, but set during frontend image build)
  # VITE_API_URL: "/api"
  # VITE_WS_URL: "" # Typically derived by frontend based on its own host
  # VITE_WEBSOCKET_PATH: "/socket.io"

---
# --- Backend Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwnagotchi-backend # Helm: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: backend
    # Helm: {{ include "pwnagotchi-dashboard.labels" . | nindent 4 }}
    # Helm: app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1 # {{ .Values.backend.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pwnagotchi-dashboard
      app.kubernetes.io/component: backend
      # Helm: app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwnagotchi-dashboard
        app.kubernetes.io/component: backend
        # Helm: {{ include "pwnagotchi-dashboard.labels" . | nindent 8 }}
        # Helm: app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # serviceAccountName: {{ .Values.backend.serviceAccountName | default "default" }}
      containers:
      - name: backend
        image: yourregistry/pwnagotchi-backend:latest # {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: IfNotPresent # {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 3001 # Matches BACKEND_PORT
        envFrom:
        - configMapRef:
            name: pwnagotchi-dashboard-config # Helm: {{ .Release.Name }}-config
        volumeMounts:
        - name: ssh-key-volume
          mountPath: "/etc/ssh-keys" # Mount directory
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: # {{ toYaml .Values.backend.resources | nindent 10 }}
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "500m", memory: "256Mi" }
      volumes:
      - name: ssh-key-volume
        secret:
          secretName: pwnagotchi-ssh-key # {{ .Values.pwnagotchi.sshKeySecretName }} - User must create this secret
          # The secret should contain a key named 'pwnagotchi_rsa' (or whatever the PWNAGOTCHI_SSH_KEY_PATH filename is)
          defaultMode: 0400 # SSH key permissions

---
# --- Backend Service ---
apiVersion: v1
kind: Service
metadata:
  name: pwnagotchi-backend-service
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: backend
  ports:
  - name: http
    port: 80 # Service port
    targetPort: http # Pod port name

---
# --- Frontend Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwnagotchi-frontend
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pwnagotchi-dashboard
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwnagotchi-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: yourregistry/pwnagotchi-frontend:latest # Replace
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80 # Nginx port
        # envFrom: # If frontend runtime needed env vars (less common for static sites)
        # - configMapRef:
        #     name: pwnagotchi-dashboard-config
        livenessProbe:
          httpGet:
            path: /index.html
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /index.html
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "200m", memory: "128Mi" }

---
# --- Frontend Service ---
apiVersion: v1
kind: Service
metadata:
  name: pwnagotchi-frontend-service
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http

---
# --- Redis Deployment --- (Original content follows, will be updated in next step)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwnagotchi-redis # Renamed for consistency
  labels: # Added standard labels
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels: # Updated selector
      app.kubernetes.io/name: pwnagotchi-dashboard
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: # Updated labels
        app.kubernetes.io/name: pwnagotchi-dashboard
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine # Updated to 7-alpine to match compose
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis # Named port
          containerPort: 6379
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "200m", memory: "256Mi" }
        # volumeMounts:
        # - name: redis-data
        #   mountPath: /data # If using PVC
      # volumes:
      # - name: redis-data
      #   persistentVolumeClaim:
      #     claimName: pwnagotchi-redis-pvc # PVC needs to be created separately

---
# --- Redis Service ---
apiVersion: v1
kind: Service
metadata:
  name: pwnagotchi-redis-service # Renamed for consistency
  labels: # Added standard labels
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector: # Updated selector
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: redis
  ports:
  - name: redis # Named port
    port: 6379
    targetPort: redis # Target named port

---
# --- Backend HorizontalPodAutoscaler ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pwnagotchi-backend-hpa
  labels: # Added standard labels
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pwnagotchi-backend
  minReplicas: 1 # Matched to backend deployment replica
  maxReplicas: 5 # Adjusted
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Adjusted
  # - type: Resource
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization
  #       averageUtilization: 70

---
# --- Prometheus ConfigMap for its configuration ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pwnagotchi-prometheus-config
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'pwnagotchi-backend'
        static_configs:
          - targets: ['pwnagotchi-backend-service:80'] # Service name and port for backend

---
# --- Prometheus Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwnagotchi-prometheus
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pwnagotchi-dashboard
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwnagotchi-dashboard
        app.kubernetes.io/component: monitoring
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
        ports:
        - name: web
          containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: storage-volume
          mountPath: /prometheus
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { cpu: "500m", memory: "512Mi" }
      volumes:
      - name: config-volume
        configMap:
          name: pwnagotchi-prometheus-config
      - name: storage-volume
        emptyDir: {} # For ephemeral storage; use PVC for persistence

---
# --- Prometheus Service ---
apiVersion: v1
kind: Service
metadata:
  name: pwnagotchi-prometheus-service
  labels:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP # Or LoadBalancer/NodePort if you want to expose it externally directly
  selector:
    app.kubernetes.io/name: pwnagotchi-dashboard
    app.kubernetes.io/component: monitoring
  ports:
  - name: web
    port: 9090
    targetPort: web

