apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwnagotchi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pwnagotchi-backend
  template:
    metadata:
      labels:
        app: pwnagotchi-backend
    spec:
      containers:
      - name: backend
        image: yourregistry/pwnagotchi-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_URL
          value: redis://redis:6379

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: pwnagotchi-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:6-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pwnagotchi-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50