server {
    listen 80;
    server_name _; # Default to listen on all hostnames for local dev; can be overridden by env var in prod

    root /usr/share/nginx/html;
    index index.html;

    # Standard gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    # Common mime types, text/plain and application/json are important for APIs if they pass through here (though /api is proxied)
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001; # Match backend service name and actual listening port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Not strictly necessary for non-WebSocket, but harmless
        proxy_set_header Connection 'upgrade';  # Same as above
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade; # Ensure no caching for API calls
    }

    # Ensure this location matches WEBSOCKET_PATH (default /socket.io)
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/; # Match backend service name, port, and path
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade'; # Crucial for WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers can be kept, but CSP might need adjustment based on actual app needs
    # For local dev, a very permissive CSP might be fine, but for prod it should be tightened.
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://localhost:3001 wss://localhost:3001 http://localhost:3001 https://localhost:3001; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;
    # For now, let's keep the original less restrictive ones for broader compatibility during dev, can be tightened in Phase 7.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Strict-Transport-Security should only be used if HTTPS is enforced and reliable.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
}

